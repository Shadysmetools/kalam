[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
repository = "https://github.com/kalam-lang/kalam"

[workspace.dependencies]
# External dependencies (keep this list short; see ARCHITECTURE.md §3.2 rule 5).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal crates.
kalam-base = { path = "crates/kalam-base" }
kalam-skins = { path = "crates/kalam-skins" }
kalam-diagnostics = { path = "crates/kalam-diagnostics" }
kalam-lexer = { path = "crates/kalam-lexer" }
kalam-syntax = { path = "crates/kalam-syntax" }
kalam-parser = { path = "crates/kalam-parser" }
kalam-fmt = { path = "crates/kalam-fmt" }
kalam-resolve = { path = "crates/kalam-resolve" }
kalam-sinks = { path = "crates/kalam-sinks" }
kalam-typeck = { path = "crates/kalam-typeck" }
kalam-effects = { path = "crates/kalam-effects" }
kalam-ir = { path = "crates/kalam-ir" }
kalam-emit-js = { path = "crates/kalam-emit-js" }
kalam-driver = { path = "crates/kalam-driver" }
kalam-pkg = { path = "crates/kalam-pkg" }
kalam-test-runner = { path = "crates/kalam-test-runner" }
kalam-lsp = { path = "crates/kalam-lsp" }
kalam-mcp = { path = "crates/kalam-mcp" }

[profile.release]
lto = "thin"
codegen-units = 1
