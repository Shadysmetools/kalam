[package]
name = "kalam-eval"
description = "Kalam eval harness: computes the scorecard metrics that are measurable today (eval/LOOP.md, eval/SCORECARD.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kalam-base.workspace = true
kalam-skins.workspace = true
kalam-diagnostics.workspace = true
kalam-lexer.workspace = true
kalam-fmt.workspace = true
kalam-syntax.workspace = true
serde_json.workspace = true
# Parser hook (src/parity.rs): the same entry points as the `kalam` CLI. Parse =
# `kalam_parser::parse_source`, canonical form = KCF (`kalam_syntax::kcf::serialize_in`),
# `kalam fmt` / `kalam convert` = `kalam_driver::format_source` / `convert_source`. There is
# no fallback canonical form. Build with `--no-default-features` if these signatures move:
# every parser-dependent check then reports `not_measurable`.
kalam-parser = { workspace = true, optional = true }
kalam-driver = { workspace = true, optional = true }

[features]
default = ["parser-hook"]
parser-hook = ["dep:kalam-parser", "dep:kalam-driver"]

[[bin]]
name = "kalam-eval"
path = "src/main.rs"
