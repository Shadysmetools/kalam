[package]
name = "kalam-syntax"
description = "Lossless CST, typed AST views, Kalam Canonical Form (KCF)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kalam-base.workspace = true
kalam-skins.workspace = true
# KCF re-lexes the code inside interpolation holes (spec §4.4: hole code is code).
kalam-lexer.workspace = true

[dev-dependencies]
# Integration tests only (tests/*.rs): the parser builds the CSTs that KCF serializes.
kalam-parser.workspace = true
# Integration tests only: `kcf(fmt(x)) == kcf(x)` (tests/kcf_fmt.rs). A dev-dependency cycle
# (kalam-fmt depends on this crate) is fine for integration tests.
kalam-fmt.workspace = true
serde_json.workspace = true
